# Publica o site (só a versão com vagas reais) no GitHub Pages a cada push.
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Montar o site (sem teste, revisão e documentos)
        run: |
          mkdir -p _site/dados
          cp index.html app.js app.css _site/
          cp -r vendor _site/
          cp dados/mapa-paraguai.js dados/ocupaciones.js dados/vagas-reais.js _site/dados/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
